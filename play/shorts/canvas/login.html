<!doctype html>
<!--
  Mock sign-in code screen for the OTP short (day 16). A made-up brand, "Lumio", so it
  stands in for no real service. Served by the same http.server as chat.html:
    http://localhost:8791/login.html?email=sam@example.com
  The code field is a one-line <textarea> with inputmode="numeric" and name="otp". Not an
  <input>: Chrome puts its autofill bar (password, card, address) above the keyboard for
  any input box, which clutters the shot. Verify (or Enter) on six digits shows the
  signed-in state.
-->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Sign in</title>
<style>
  :root { --bg:#0b0f17; --card:#121826; --text:#e8ecf4; --muted:#8a94a8; --line:#2a3346;
    --accent:#6d5cff; --accent2:#22c3ee; --ok:#2fbf71; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  main { flex:1; display:flex; flex-direction:column; padding:44px 24px 16px; gap:18px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; letter-spacing:.2px; }
  .logo { width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid; place-items:center; color:#fff; font-size:19px; }
  h1 { margin:18px 0 0; font-size:27px; line-height:1.2; }
  p { margin:0; color:var(--muted); }
  p b { color:var(--text); font-weight:600; }
  textarea { width:100%; resize:none; overflow:hidden; height:68px; display:block; margin-top:10px; padding:16px 18px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--card); color:var(--text); outline:0; font:600 30px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing:12px; text-align:center; caret-color:var(--accent2); }
  textarea:focus { border-color:var(--accent); }
  textarea::placeholder { color:#3b465c; }
  .resend { font-size:15px; color:var(--muted); }
  .resend span { color:#9db4ff; }
  button { margin-top:6px; padding:15px; border:0; border-radius:14px; font:600 17px system-ui, sans-serif;
    background:linear-gradient(135deg,var(--accent),#5468ff); color:#fff; opacity:.45; transition:opacity .2s; }
  button.ready { opacity:1; }
  .done { flex:1; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
  .tick { width:76px; height:76px; border-radius:50%; background:rgba(47,191,113,.15); color:var(--ok);
    display:grid; place-items:center; font-size:40px; transform:scale(.6); opacity:0; transition:all .35s cubic-bezier(.2,.9,.3,1.3); }
  body.signed main { display:none; }
  body.signed .done { display:flex; }
  body.signed .tick { transform:scale(1); opacity:1; }
</style>
</head>
<body>
<main>
  <div class="brand"><div class="logo">✦</div>Lumio</div>
  <h1>Enter your code</h1>
  <p>We sent a 6-digit code to <b id="email">sam@example.com</b>. It expires in 10 minutes.</p>
  <textarea id="code" rows="1" inputmode="numeric" autocomplete="off" name="otp"
         maxlength="6" placeholder="••••••" aria-label="Verification code"></textarea>
  <div class="resend">Didn't get it? <span>Resend code</span></div>
  <button id="go">Verify</button>
</main>
<div class="done">
  <div class="tick">✓</div>
  <h1 style="margin:0">You're signed in</h1>
  <p>Welcome back.</p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("email")) document.getElementById("email").textContent = q.get("email");
  const code = document.getElementById("code"), go = document.getElementById("go");
  const sync = () => {
    code.value = code.value.replace(/\D/g, "").slice(0, 6);
    go.classList.toggle("ready", code.value.length === 6);
  };
  const submit = () => { if (code.value.length === 6) { code.blur(); document.body.classList.add("signed"); } };
  code.addEventListener("input", sync);
  code.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
  go.addEventListener("click", submit);
</script>
</body>
</html>
