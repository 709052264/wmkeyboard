<!doctype html>
<!--
  Neutral chat canvas for shorts capture. The phone has the release build, which has no
  DocsShotActivity, so this page stands in for it. Serve from play/shorts/canvas and open
  through `adb reverse tcp:8765 tcp:8765`:
    http://localhost:8765/chat.html?title=Dinner%20crew&b=<dinner was 2,840 total|<we're 4 people|<how much each?
  b = bubbles separated by |, "<" incoming, ">" outgoing. name = sender label for incoming.
  theme=light for a light page. mode=field shows a single labelled field instead of a chat.
  The first tap anywhere goes full screen, which hides Chrome's toolbar and the status bar.
-->
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Chat</title>
<style>
  :root { --bg:#0b0f17; --head:#121826; --in:#1c2433; --out:#3b5bdb; --text:#e8ecf4; --muted:#8a94a8; --field:#161d2b; }
  :root[data-theme=light] { --bg:#f3f5f9; --head:#ffffff; --in:#ffffff; --out:#3b5bdb; --text:#111826; --muted:#667085; --field:#ffffff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--head);
    border-bottom:1px solid rgba(127,127,127,.15); }
  .av { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#7c5cff,#22c3ee);
    display:grid; place-items:center; font-weight:700; color:#fff; }
  header b { display:block; } header small { color:var(--muted); }
  main { flex:1; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:78%; padding:9px 13px; border-radius:18px; white-space:pre-wrap; word-wrap:break-word; }
  .in { align-self:flex-start; background:var(--in); border-bottom-left-radius:6px; }
  .out { align-self:flex-end; background:var(--out); color:#fff; border-bottom-right-radius:6px; }
  .who { font-size:12px; color:#9db4ff; display:block; margin-bottom:2px; }
  footer { display:flex; gap:8px; align-items:flex-end; padding:8px 10px 10px; background:var(--head); }
  textarea { flex:1; resize:none; border:0; outline:0; border-radius:22px; padding:11px 16px; max-height:140px;
    background:var(--field); color:var(--text); font:inherit; }
  button { width:44px; height:44px; border-radius:50%; border:0; background:var(--out); color:#fff; font-size:20px; }
  .field { flex:1; display:flex; flex-direction:column; justify-content:flex-start; padding:28px 18px; gap:8px; }
  .field label { color:var(--muted); font-size:14px; }
  .field textarea { border-radius:14px; min-height:120px; max-height:none; border:1px solid rgba(127,127,127,.3); }
</style>
</head>
<body>
<header><div class="av" id="av">D</div><div><b id="title">Chat</b><small id="sub">online</small></div></header>
<main id="log"></main>
<footer id="bar"><textarea id="t" rows="1" placeholder="Message" autocomplete="off"></textarea><button id="send" aria-label="Send">➤</button></footer>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "light") document.documentElement.dataset.theme = "light";
  const title = q.get("title") || "Chat";
  document.getElementById("title").textContent = title;
  document.getElementById("av").textContent = title.trim()[0] || "C";
  if (q.get("sub")) document.getElementById("sub").textContent = q.get("sub");
  const log = document.getElementById("log"), t = document.getElementById("t");
  const add = (text, out, who) => {
    const d = document.createElement("div");
    d.className = "m " + (out ? "out" : "in");
    if (who && !out) { const w = document.createElement("span"); w.className = "who"; w.textContent = who; d.append(w); }
    d.append(document.createTextNode(text));
    log.append(d); log.scrollTop = log.scrollHeight;
  };
  const names = (q.get("names") || "").split("|");
  (q.get("b") || "").split("|").filter(Boolean).forEach((s, i) => add(s.slice(1), s[0] === ">", names[i]));
  if (q.get("mode") === "field") {
    log.remove(); document.getElementById("bar").remove();
    const f = document.createElement("div"); f.className = "field";
    f.innerHTML = '<label for="t"></label>'; f.querySelector("label").textContent = q.get("hint") || "Type here";
    if (q.get("kind") === "number") {
      // A one-line numeric field (sign-in code screens): the IME sees TYPE_CLASS_NUMBER.
      const n = document.createElement("input");
      n.id = "t"; n.type = "text"; n.inputMode = "numeric"; n.autocomplete = "one-time-code";
      n.style.cssText = "font:28px/1.2 inherit;letter-spacing:.3em;padding:14px 16px;border-radius:14px;border:1px solid rgba(127,127,127,.3);background:var(--field);color:var(--text)";
      f.append(n); document.body.append(f); t.remove();
    } else {
      f.append(t); t.rows = 4; t.placeholder = ""; document.body.append(f);
    }
  }
  const send = () => { const v = t.value.trim(); if (!v) return; add(v, true); t.value = ""; t.focus(); };
  document.getElementById("send").onclick = send;
  t.addEventListener("input", () => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; });
  // First tap: full screen (hides Chrome UI + status bar), then focus the field.
  addEventListener("pointerdown", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  }, { once: true });
  if (q.get("text")) t.value = q.get("text");
</script>
</body>
</html>
