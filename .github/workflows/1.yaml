name: F-Droid EN arm64 APK (minimal permissions - EN Version-2)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to build (blank = branch head)"
        required: false
        default: ""

env:
  # Permissions to KEEP (full names, | separated).
  KEEP_PERMS: 'android.permission.POST_NOTIFICATIONS|android.permission.HIGH_SAMPLING_RATE_SENSORS'
  GRADLE_ARGS: >-
    -Pwmkb.enableFdroid=true -Pwmkb.noInternet=true
    -Pwmkb.enableGms=false -Pwmkb.enablePlayStore=false -Pwmkb.enableNpu=false
    -Pwmkb.abi=arm64-v8a -Pkotlin.daemon.jvmargs=-Xmx4g

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Baseline build (to learn the merged permissions)
        run: ./gradlew assembleEnRelease $GRADLE_ARGS --stacktrace

      - name: Diagnose compile error
        if: failure()
        run: |
          f=feature/ime/src/main/java/com/wasimaster/wmkeyboard/ime/WMKeyboardService.kt
          echo "=== commit ==="; git log -1 --format='%H %s'
          echo "=== call site near 31622 ==="; sed -n '31610,31635p' "$f"
          echo "=== second call site near 32300 ==="; sed -n '32290,32310p' "$f"
          echo "=== functions declaring a raise parameter ==="
          grep -rnE "raise\s*:\s*" --include=*.kt . | grep -v '/build/' | head -20

      - name: Generate permission-stripping overlay
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$(find app/build/outputs/apk/en/release -name '*.apk' | head -1)
          test -n "$apk"
          "$bt/aapt" dump permissions "$apk" | tee "$RUNNER_TEMP/perms-before.txt"

          mkdir -p app/src/enRelease
          {
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"'
            echo '          xmlns:tools="http://schemas.android.com/tools">'
            awk -F"'" '/^uses-permission/ { split($1, a, ":"); print a[1], $2 }' \
                "$RUNNER_TEMP/perms-before.txt" | sort -u |
            while read -r tag name; do
              case "$name" in com.wasimaster.wmkeyboard.*) continue ;; esac
              if echo "$name" | grep -Eq "^($KEEP_PERMS)$"; then continue; fi
              echo "  <$tag android:name=\"$name\" tools:node=\"remove\" />"
            done
            echo '</manifest>'
          } > app/src/enRelease/AndroidManifest.xml
          cat app/src/enRelease/AndroidManifest.xml

      - name: Final build
        run: ./gradlew assembleEnRelease $GRADLE_ARGS --stacktrace

      - name: Sign if unsigned, then verify ABI and permissions
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$(find app/build/outputs/apk/en/release -name '*.apk' | head -1)
          test -n "$apk"
          if ! "$bt/apksigner" verify "$apk"; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" \
              --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey "$apk"
          fi
          "$bt/aapt" dump badging "$apk" | grep -E "native-code|package:"
          "$bt/aapt" dump badging "$apk" | grep native-code | grep -Eq "armeabi-v7a|x86" && exit 1

          "$bt/aapt" dump permissions "$apk" | tee "$RUNNER_TEMP/perms-after.txt"
          bad=$(awk -F"'" '/^uses-permission/ {print $2}' "$RUNNER_TEMP/perms-after.txt" \
                | { grep -Ev '^com\.wasimaster\.wmkeyboard\.' || true; } \
                | { grep -Evx "$KEEP_PERMS" || true; })
          if [ -n "$bad" ]; then echo "Unexpected permissions:"; echo "$bad"; exit 1; fi

          cp "$apk" "$RUNNER_TEMP/wmkeyboard-en-arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: wmkeyboard-en-arm64
          path: ${{ runner.temp }}/wmkeyboard-en-arm64.apk
          retention-days: 14
