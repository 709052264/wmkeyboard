[package]
name = "harper-jni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "harper_jni"
crate-type = ["cdylib"]

[dependencies]
# default-features = false drops the `thesaurus` feature (harper-thesaurus is
# ~8 MB of embedded synonym data). lib.rs only lints — LintGroup/FstDictionary —
# and never touches the synonym API, so the data was dead weight in the .so.
harper-core = { version = "2.5", default-features = false }
jni = "0.21"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
# Size over speed: linting runs on a background thread against short texts;
# shaving MB off every install beats single-digit-% lint latency.
opt-level = "z"

# harper-core and harper-brill embed their dictionary and trained models as
# plain text and bytes, 2.9 MB of the .so. These vendored copies store them
# deflated and inflate them once, on first use; nothing else differs from the
# published 2.5.0 crates. See README.md before bumping harper-core.
[patch.crates-io]
harper-core = { path = "vendor/harper-core" }
harper-brill = { path = "vendor/harper-brill" }
const-random-macro = { path = "vendor/const-random-macro" }
blanket = { path = "vendor/blanket" }
