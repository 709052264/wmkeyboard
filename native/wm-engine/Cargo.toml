[package]
name = "wm-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "WM Keyboard's text engines: one implementation for the Android app (through JNI) and for WMK Desktop"

[lib]
name = "wm_engine"

# The crate is the engine only; platform bridges (JNI for Android, the desktop
# daemon) are separate crates that depend on it. serde_json reads ibus-avro's
# grammar files, which are compiled in from the app's assets.
#
# ICU4X (Unicode-3.0) for the Unicode the phone gets from the platform ICU:
# case mapping, NFC and general categories for the word key (`word_key`), and
# word segmentation for Thai, Lao, Khmer and Burmese (`segment`). Only the
# pieces used, with compiled data: each constructor names only its own data
# and the linker drops the rest, so the segmenter brings its LSTM models and
# never the Chinese and Japanese dictionary (see `segment`).
[dependencies]
serde_json = "1"
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.3", default-features = false }
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data", "lstm"] }
# The Khipro specs are compiled in deflated (build.rs) and inflated on first
# use: 196 KB of text down to about 30 KB.
miniz_oxide = "0.9"

[build-dependencies]
miniz_oxide = "0.9"

[profile.release]
lto = true
codegen-units = 1
